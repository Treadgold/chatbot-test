# Fail2Ban filter for WordPress-related attacks on chatbot application
#
# This filter detects attempts to access WordPress files and admin areas
# which are common targets for automated scanning and attacks

[Definition]

# Match WordPress-related attack patterns
failregex = ^<HOST> -.*"(GET|POST) .*(wp-|wordpress|xmlrpc\.php|wp-admin|wp-content|wp-includes|wlwmanifest\.xml|\.php).*" (404|403|400)
            ^<HOST> -.*"(GET|POST) .*/blog/.*" (404|403)
            ^<HOST> -.*"(GET|POST) .*/cms/.*" (404|403)
            ^<HOST> -.*"(GET|POST) .*/website/.*" (404|403)
            ^<HOST> -.*"(GET|POST) .*/web/.*" (404|403)
            ^<HOST> -.*"(GET|POST) .*\.(asp|jsp|cgi|exe|bat).*" (404|403)

# Ignore successful requests
ignoreregex = ^<HOST> -.*"(GET|POST) .*" (200|301|302)

# Date format used in nginx logs (adjust if using different log format)
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S 