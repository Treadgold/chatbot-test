# Fail2Ban filter for rate limiting violations
#
# This filter detects when users exceed rate limits or make
# excessive requests to the chatbot application

[Definition]

# Match rate limiting patterns
failregex = ^<HOST> -.*"(GET|POST) .*" 429
            ^<HOST> -.*"(GET|POST) .*" 503.*rate.*limit
            ^<HOST> -.*"(GET|POST) /chat.*" - \d+ requests in \d+ seconds exceeds limit

# Ignore normal requests
ignoreregex = ^<HOST> -.*"(GET|POST) .*" (200|301|302|304)

# Date format
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S 